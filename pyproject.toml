[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "validkit"
version = "0.1.0"
description = "validkit – Prüf- und Normalisierungsfunktionen als eigenständige Python-Bibliothek ohne externe Abhängigkeiten."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0,<9.0"]

[tool.setuptools.packages.find]
include = ["validkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
